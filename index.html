<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.json">
<title>Set List</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:#f4f4f6;color:#111}
button,input,select,textarea{font:inherit}
.wrap{max-width:820px;margin:auto;padding:12px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:23px;margin:0}
.version{font-size:11px;color:#888;margin-top:1px}
.card{background:#fff;border:1px solid #dadde1;border-radius:12px;padding:9px;margin:9px 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}
.tab,.btn{min-height:38px;border-radius:9px;border:1px solid #cfd3d8;background:#fff;color:#111;padding:6px 10px}
.tab.active,.btn.primary{background:#111;color:#fff;border-color:#111}
.panel{display:none}.panel.active{display:block}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
input,select,textarea{min-height:38px;border:1px solid #cfd3d8;border-radius:9px;background:#fff;color:#111;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) 32px 38px;gap:7px;align-items:center;padding:7px 0;border-top:1px solid #eceef1}
.row:first-child{border-top:0}
.songline{display:flex;align-items:baseline;gap:8px;min-width:0}
.title{font-weight:650;line-height:1.18}
.duration{font-size:13px;color:#6c7179;white-space:nowrap}
.actions{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.toggle,.remove{width:38px;min-width:38px;padding:4px;font-size:18px;font-weight:700}
.remove{border-color:#d5d7db;background:#fff;color:#555}
.toggle.inset{background:#34c759;color:#fff;border-color:#34c759}
.section{font-size:16px;font-weight:700;margin-bottom:6px}
.note,.meta{font-size:12px;color:#6c7179}
.empty{text-align:center;padding:12px;color:#777}
.addCard summary{font-weight:650;cursor:pointer;list-style:none;padding:2px 0}
.addCard summary::-webkit-details-marker{display:none}
.addCard summary::after{content:"＋";float:right;font-size:18px;font-weight:400}
.addCard[open] summary::after{content:"−"}
.form{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 105px auto;gap:6px;margin-top:8px}
.bulkActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bulkActions select{min-width:110px}
.stickyStats{position:sticky;top:0;z-index:20;background:rgba(244,244,246,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 0}
.statbar{background:#fff;border:1px solid #dadde1;border-radius:10px;padding:8px 10px;text-align:center;font-weight:650}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) 38px 32px;gap:7px;align-items:center;padding:8px 0;border-top:1px solid #eceef1;touch-action:pan-y}
.setrow:first-child{border-top:0}
.num{font-size:13px;color:#777;text-align:center}
.handle{font-size:22px;color:#777;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.setrow.dragging{opacity:.45}
.setrow.dragover{border-top:2px solid #777}
.savebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.backup{margin-top:28px}
.holdhint{font-size:11px;color:#8a8f96;margin-top:4px}
@media(max-width:650px){
 .wrap{padding:10px}
 .row{grid-template-columns:minmax(0,1fr) 32px 38px}
 .form{grid-template-columns:minmax(0,1fr) 56px 56px}
 .form select{grid-column:1/3}
 .form .add{grid-column:3}
 .tabs .tab{white-space:nowrap}
}
@media(prefers-color-scheme:dark){
 body{background:#111214;color:#f5f5f7}
 .card,.tab,.btn,input,select,textarea,.statbar{background:#1d1f22;color:#f5f5f7;border-color:#35383e}
 .tab.active,.btn.primary{background:#f5f5f7;color:#111;border-color:#f5f5f7}
 .duration,.note,.meta,.holdhint,.num,.handle,.version{color:#a8adb5}
 .row,.setrow{border-color:#2d3035}
 .stickyStats{background:rgba(17,18,20,.94)}
 .toggle.inset{background:#34c759;color:#fff;border-color:#34c759}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>Set List</h1><div class="version">Version 1.12</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="rep">Repertoire</button>
    <button class="tab" data-tab="set">Current Set</button>
    <button class="tab" data-tab="saved">Saved Sets</button>
  </div>

  <section id="panel-rep" class="panel active">
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Поиск песни…">
        <select id="filter">
          <option value="All">All</option>
          <option value="MessAge">MessAge</option>
          <option value="Браво">Браво</option>
        </select>
      </div>
      <div class="stickyStats"><div class="statbar"><span id="repCount">0</span> songs · Total <span id="repTotal">0:00</span></div></div>
      <div id="rep"></div>
      <div class="holdhint">Удерживайте название песни для редактирования.</div>
    </div>

    <details class="card addCard">
      <summary>Add song</summary>
      <form id="addForm" class="form">
        <input id="newTitle" type="text" placeholder="Название" required>
        <input id="newMin" type="number" min="0" max="99" inputmode="numeric" placeholder="мин" required>
        <input id="newSec" type="number" min="0" max="59" inputmode="numeric" placeholder="сек" required>
        <select id="newProject"><option>Браво</option><option>MessAge</option></select>
        <button class="btn primary add" type="submit">Add</button>
      </form>
    </details>

    <details class="card addCard">
      <summary>Добавить списком</summary>
      <textarea id="bulkText" placeholder="Этот город — 3:42&#10;Любите, девушки — 4:05&#10;Вася — 3:18"></textarea>
      <div class="bulkActions">
        <select id="bulkProject"><option>Браво</option><option>MessAge</option></select>
        <button id="bulkAdd" class="btn primary" type="button">Добавить все</button>
      </div>
      <div class="note">Одна песня на строку: Название — 3:42.</div>
      <div id="bulkResult" class="note"></div>
    </details>
  </section>

  <section id="panel-set" class="panel">
    <div class="stickyStats"><div class="statbar"><span id="count">0</span> songs · Total <span id="total">0:00</span></div></div>
    <div class="card"><div id="main"></div></div>
    <div class="card">
      <button id="clearSet" class="btn" type="button">Clear current set</button>
    </div>
    <div class="card">
      <div class="section">Save current set</div>
      <div class="savebar">
        <input id="setName" type="text" placeholder="Название сета">
        <button id="saveSet" class="btn primary" type="button">Save</button>
      </div>
    </div>
  </section>

  <section id="panel-saved" class="panel">
    <div class="card"><div class="section">Saved Sets</div><div id="saved"></div></div>
    <div class="card backup">
      <div class="section">Backup / Restore</div>
      <div class="actions">
        <button id="exportBackup" class="btn primary" type="button">Export Backup</button>
        <button id="importBackup" class="btn" type="button">Import Backup</button>
        <input id="backupFile" type="file" accept=".json,application/json" style="display:none">
      </div>
      <div class="note">Backup содержит репертуар, Current Set и все Saved Sets.</div>
    </div>
  </section>
</div>

<script>
const starter=[
["When Your Love Is In Town",4,38],["I've Got To Know",4,55],["Tears",4,13],
["Troubles",4,2],["Take Me Up",4,24],["Middle Of The Road",3,42],
["Partners In Pain",4,24],["Traveller In Time",3,5],["All You Want",4,16],
["The Cult Of New Moon",3,35],["Lust",3,36],["When It's Over",3,59]
];
const fmt=s=>{s=Math.max(0,Math.round(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`};
const clone=x=>JSON.parse(JSON.stringify(x));
const $=id=>document.getElementById(id);

let songs=JSON.parse(localStorage.getItem("setlist_songs")||"null") ||
 starter.map((x,i)=>({id:"m"+i,title:x[0],duration:x[1]*60+x[2],project:"MessAge"}));
let main=JSON.parse(localStorage.getItem("setlist_main")||"[]");
let oldEncore=JSON.parse(localStorage.getItem("setlist_encore")||"[]");
if(oldEncore.length){
 const ids=new Set(main.map(x=>x.id));
 oldEncore.forEach(x=>{if(!ids.has(x.id)){main.push({id:x.id});ids.add(x.id)}});
 oldEncore=[];
}
let saved=JSON.parse(localStorage.getItem("setlist_saved")||"[]").map(x=>({
 name:x.name,
 main:[...(x.main||[]),...(x.encore||[])].filter((v,i,a)=>a.findIndex(y=>y.id===v.id)===i)
}));

function persist(){
 localStorage.setItem("setlist_songs",JSON.stringify(songs));
 localStorage.setItem("setlist_main",JSON.stringify(main.map(x=>({id:x.id}))));
 localStorage.setItem("setlist_encore","[]");
 localStorage.setItem("setlist_saved",JSON.stringify(saved.map(x=>({name:x.name,main:x.main,encore:[]}))));
}
const byId=id=>songs.find(s=>s.id===id);
const inSet=id=>main.some(x=>x.id===id);

function summary(){
 const total=main.reduce((n,x)=>n+(byId(x.id)?.duration||0),0);
 $("total").textContent=fmt(total);
 $("count").textContent=main.length;
 $("repTotal").textContent=fmt(total);
 $("repCount").textContent=main.length;
}
function editSong(id){
 const s=byId(id); if(!s)return;
 const title=prompt("Название песни:",s.title); if(title===null)return;
 const cleanTitle=title.trim(); if(!cleanTitle){alert("Название не может быть пустым.");return}
 const minText=prompt("Минуты:",String(Math.floor(s.duration/60))); if(minText===null)return;
 const secText=prompt("Секунды (0–59):",String(s.duration%60)); if(secText===null)return;
 const min=Number(minText),sec=Number(secText);
 if(!Number.isInteger(min)||min<0||!Number.isInteger(sec)||sec<0||sec>59){alert("Неверно указано время.");return}
 const projectText=prompt("Проект: Браво или MessAge",s.project); if(projectText===null)return;
 const normalized=projectText.trim().toLowerCase();
 let project;
 if(normalized==="браво")project="Браво";
 else if(normalized==="message")project="MessAge";
 else{alert("Проект должен быть «Браво» или «MessAge».");return}
 s.title=cleanTitle;s.duration=min*60+sec;s.project=project;
 persist();renderAll();
}
function toggleSet(id){
 const i=main.findIndex(x=>x.id===id);
 if(i>=0)main.splice(i,1); else main.push({id});
 persist();renderAll();
}
function bindLongPress(el,id){
 let timer=null,moved=false;
 const start=()=>{moved=false;timer=setTimeout(()=>{timer=null;if(!moved)editSong(id)},600)};
 const cancel=()=>{if(timer){clearTimeout(timer);timer=null}};
 el.addEventListener("touchstart",start,{passive:true});
 el.addEventListener("touchmove",()=>{moved=true;cancel()},{passive:true});
 el.addEventListener("touchend",cancel,{passive:true});
 el.addEventListener("touchcancel",cancel,{passive:true});
 el.addEventListener("contextmenu",e=>{e.preventDefault();editSong(id)});
}
function reorderVisibleSongs(visibleIds){
 const visibleSet=new Set(visibleIds),slots=[];
 songs.forEach((s,i)=>{if(visibleSet.has(s.id))slots.push(i)});
 if(slots.length!==visibleIds.length)return;
 const map=new Map(songs.map(s=>[s.id,s]));
 slots.forEach((slot,i)=>{songs[slot]=map.get(visibleIds[i])});
 persist();renderRep();
}
function enableHandleDrag(handle,row,host,onFinish){
 let active=false;

 const moveRowToPoint=(x,y)=>{
  const targetEl=document.elementFromPoint(x,y);
  const target=targetEl && targetEl.closest ? targetEl.closest(".row, .setrow") : null;
  if(!target || target===row || target.parentElement!==host)return;
  const b=target.getBoundingClientRect();
  if(y < b.top + b.height/2) host.insertBefore(row,target);
  else host.insertBefore(row,target.nextSibling);
 };

 // iPhone / iPad Safari
 handle.addEventListener("touchstart",e=>{
  active=true;
  row.classList.add("dragging");
  e.preventDefault();
 },{passive:false});

 handle.addEventListener("touchmove",e=>{
  if(!active || !e.touches.length)return;
  const t=e.touches[0];
  moveRowToPoint(t.clientX,t.clientY);
  e.preventDefault();
 },{passive:false});

 const finishTouch=e=>{
  if(!active)return;
  active=false;
  row.classList.remove("dragging");
  onFinish();
  e.preventDefault();
 };
 handle.addEventListener("touchend",finishTouch,{passive:false});
 handle.addEventListener("touchcancel",finishTouch,{passive:false});

 // Desktop / mouse fallback
 handle.draggable=true;
 handle.addEventListener("dragstart",e=>{
  active=true;
  row.classList.add("dragging");
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain","move")}catch(_){}
  }
 });
 host.addEventListener("dragover",e=>{
  if(!active)return;
  e.preventDefault();
  moveRowToPoint(e.clientX,e.clientY);
 });
 handle.addEventListener("dragend",()=>{
  if(!active)return;
  active=false;
  row.classList.remove("dragging");
  onFinish();
 });
}
function renderRep(){
 const q=$("search").value.trim().toLowerCase(),f=$("filter").value,host=$("rep");
 host.innerHTML="";
 const list=songs.filter(s=>(f==="All"||s.project===f)&&s.title.toLowerCase().includes(q));
 if(!list.length){host.innerHTML='<div class="empty">Ничего не найдено</div>';return}
 list.forEach(s=>{
  const row=document.createElement("div");row.className="row";row.dataset.id=s.id;
  row.innerHTML='<div class="songline"><div class="title"></div><div class="duration"></div></div><div class="handle" title="Перетащить">≡</div><button class="btn toggle" type="button"></button>';
  const title=row.querySelector(".title"),btn=row.querySelector(".toggle"),handle=row.querySelector(".handle");
  title.textContent=s.title;
  row.querySelector(".duration").textContent=fmt(s.duration);
  const selected=inSet(s.id);
  btn.textContent=selected?"✓":"+";
  btn.classList.toggle("inset",selected);
  btn.setAttribute("aria-label",selected?"Убрать из Current Set":"Добавить в Current Set");
  btn.onclick=()=>toggleSet(s.id);
  bindLongPress(title,s.id);
  enableHandleDrag(handle,row,host,()=>{
    const visibleIds=[...host.querySelectorAll(".row")].map(r=>r.dataset.id);
    reorderVisibleSongs(visibleIds);
  });
  host.appendChild(row);
 });
}
function renderSet(){
 const host=$("main");host.innerHTML="";
 if(!main.length){host.innerHTML='<div class="empty">Пока пусто</div>';return}
 main.forEach((item,i)=>{
  const s=byId(item.id);if(!s)return;
  const row=document.createElement("div");row.className="setrow";row.dataset.id=s.id;
  row.innerHTML='<div class="num"></div><div class="songline"><div class="title"></div><div class="duration"></div></div><button class="btn remove" type="button" aria-label="Убрать из Current Set">−</button><div class="handle" title="Перетащить">≡</div>';
  row.querySelector(".num").textContent=i+1;
  row.querySelector(".title").textContent=s.title;
  row.querySelector(".duration").textContent=fmt(s.duration);
  row.querySelector(".remove").onclick=()=>{main=main.filter(x=>x.id!==s.id);persist();renderAll()};
  const handle=row.querySelector(".handle");
  enableHandleDrag(handle,row,host,()=>{
   const ids=[...host.querySelectorAll(".setrow")].map(r=>r.dataset.id);
   main=ids.map(id=>({id}));
   persist();
   renderAll();
  });
  host.appendChild(row);
 });
}
function renderSaved(){
 const host=$("saved");host.innerHTML="";
 if(!saved.length){host.innerHTML='<div class="empty">Сохранённых сетов пока нет</div>';return}
 saved.forEach((x,i)=>{
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div><div class="title"></div><div class="meta"></div></div><div class="actions"><button class="btn primary open">Open</button><button class="btn copy">Duplicate</button><button class="btn del">Delete</button></div>';
  row.querySelector(".title").textContent=x.name;
  row.querySelector(".meta").textContent=`${x.main.length} songs`;
  row.querySelector(".open").onclick=()=>{main=clone(x.main);persist();switchTab("set");renderAll()};
  row.querySelector(".copy").onclick=()=>{saved.push({name:x.name+" copy",main:clone(x.main)});persist();renderSaved()};
  row.querySelector(".del").onclick=()=>{if(confirm("Удалить сохранённый сет?")){saved.splice(i,1);persist();renderSaved()}};
  host.appendChild(row);
 });
}
function switchTab(name){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+name));
}
function renderAll(){renderRep();renderSet();renderSaved();summary()}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$("search").oninput=renderRep;$("filter").onchange=renderRep;

$("addForm").onsubmit=e=>{
 e.preventDefault();
 const title=$("newTitle").value.trim(),min=Number($("newMin").value),sec=Number($("newSec").value);
 if(!title||!Number.isInteger(min)||!Number.isInteger(sec)||min<0||sec<0||sec>59)return;
 songs.push({id:"s"+Date.now(),title,duration:min*60+sec,project:$("newProject").value});
 $("newTitle").value="";$("newMin").value="";$("newSec").value="";
 persist();renderRep();
};
$("bulkAdd").onclick=()=>{
 const text=$("bulkText").value.trim();
 if(!text){$("bulkResult").textContent="Вставьте список песен.";return}
 const project=$("bulkProject").value;
 const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 let added=0;const skipped=[];
 lines.forEach((line,i)=>{
  const m=line.match(/^(.*?)\s*(?:[—–-]\s*)?(\d{1,2}):([0-5]\d)\s*$/);
  if(!m){skipped.push(i+1);return}
  const title=m[1].trim().replace(/[—–-]\s*$/,"").trim();
  if(!title){skipped.push(i+1);return}
  songs.push({id:"s"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2,7),title,duration:Number(m[2])*60+Number(m[3]),project});
  added++;
 });
 if(added){persist();renderRep();$("bulkText").value=""}
 $("bulkResult").textContent=skipped.length?`Добавлено: ${added}. Не распознаны строки: ${skipped.join(", ")}.`:`Добавлено песен: ${added}.`;
};

$("clearSet").onclick=()=>{
 if(!main.length)return;
 if(!confirm("Очистить текущий сет?"))return;
 main=[];persist();renderAll();
};
$("saveSet").onclick=()=>{
 const name=$("setName").value.trim();if(!name)return;
 const existing=saved.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
 const obj={name,main:clone(main)};
 if(existing>=0)saved[existing]=obj;else saved.push(obj);
 $("setName").value="";persist();renderSaved();
};

$("exportBackup").onclick=async()=>{
 try{
  const data={app:"Set List",version:2,exportedAt:new Date().toISOString(),songs,main,encore:[],saved:saved.map(x=>({name:x.name,main:x.main,encore:[]}))};
  const json=JSON.stringify(data,null,2);
  const filename="Set_List_Backup_"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([json],filename,{type:"application/json"});
  try{
   if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
    await navigator.share({title:"Set List Backup",text:"Резервная копия Set List",files:[file]});return;
   }
  }catch(err){if(err&&err.name==="AbortError")return}
  const blob=new Blob([json],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(err){alert("Ошибка Backup: "+(err&&err.message?err.message:"unknown"))}
};
$("importBackup").onclick=()=>$("backupFile").click();
$("backupFile").onchange=async e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!data||data.app!=="Set List"||!Array.isArray(data.songs)||!Array.isArray(data.main)||!Array.isArray(data.saved))throw new Error("invalid");
  if(!confirm("Восстановить данные из backup? Текущие данные будут заменены.")){e.target.value="";return}
  songs=data.songs;
  main=[...(data.main||[]),...(data.encore||[])].filter((v,i,a)=>a.findIndex(y=>y.id===v.id)===i).map(x=>({id:x.id}));
  saved=data.saved.map(x=>({name:x.name,main:[...(x.main||[]),...(x.encore||[])].filter((v,i,a)=>a.findIndex(y=>y.id===v.id)===i).map(y=>({id:y.id}))}));
  persist();renderAll();alert("Backup восстановлен.");
 }catch(err){alert("Не удалось прочитать backup-файл.")}
 e.target.value="";
};

persist();renderAll();

if("serviceWorker" in navigator){
 navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))).catch(()=>{});
}
if("caches" in window)caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
</script>
</body>
</html>
